<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>故宫一日 · 可行走世界</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#cad0c5}canvas{height:100%;width:100%;display:block;outline:0;touch-action:none}#loading{position:absolute;inset:0;display:grid;place-content:center;gap:17px;text-align:center;color:#69755d;font:12px/1.8 system-ui;background:linear-gradient(120deg,#e6dfca,#c6d0c5)}#loading b{font:27px serif;letter-spacing:7px;color:#6d6951}#loading small{font-size:10px;color:#90957e}#error{max-width:400px;padding:20px;color:#8e4c37}</style></head><body><canvas id="canvas" tabindex="0" aria-label="故宫3D探索场景，WASD移动，E观察，拖动调整视角"></canvas><div id="loading"><b>故宫 · 正在入境</b><span id="progress">首次需要下载约 16 MB 的游戏引擎与场景</span><small>请稍候，宫城的街巷正在展开。</small><span id="error"></span></div><script>
const queue=[],SAVE_KEY='palace-explorer:v1';
window.palaceBridge={send(json){try{parent.postMessage({channel:'palace-world',...JSON.parse(json)},location.origin)}catch{}},poll(){return JSON.stringify(queue.splice(0,48))},loadSave(){try{return localStorage.getItem(SAVE_KEY)||'{}'}catch{return '{}'}},save(json){try{localStorage.setItem(SAVE_KEY,json)}catch{window.palaceBridge.send(JSON.stringify({type:'toast',text:'浏览器未允许保存，请导出存档自行保留。'}))}}};
addEventListener('message',event=>{if(event.source===parent&&event.origin===location.origin&&event.data?.channel==='palace-host'&&typeof event.data.type==='string'){queue.push(event.data);if(event.data.type==='start'||event.data.type==='travel'||event.data.type==='pause'&&!event.data.value)document.getElementById('canvas').focus()}});
addEventListener('contextmenu',event=>event.preventDefault());addEventListener('blur',()=>{queue.push({type:'release'})});
</script><script src="index.js"></script><script>const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":6632576,"index.wasm":10153810},"focusCanvas":false,"gdextensionLibs":[],"godotPoolSize":4};config.mainPack="index.pck?v=0.2.0";config.fileSizes[config.mainPack]=config.fileSizes["index.pck"];const engine=new Engine(config);engine.startGame({canvas:document.getElementById('canvas'),onProgress(current,total){document.getElementById('progress').textContent=total?'场景准备 '+Math.min(100,Math.round(current/total*100))+'%':'正在整理宫城建筑…'}}).then(()=>document.getElementById('loading').style.display='none').catch(error=>{document.getElementById('error').textContent='场景未能启动，请使用支持 WebGL 2 的新版浏览器。\n'+error.message;window.palaceBridge.send(JSON.stringify({type:'error',message:'3D场景未能启动，请刷新页面或更新浏览器。'}))});</script></body></html>
