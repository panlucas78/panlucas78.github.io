<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f2eee5"><meta name="description" content="从午门走向太和殿，在可自由行走的3D故宫中轴线首段里观察建筑、与研学角色交谈、完成知识任务并记录游历。"><title>故宫一日 · 北京故宫3D探索</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><a class="brand" href="./" aria-label="故宫一日首页"><span class="seal">故</span><span><b>故宫一日</b><small>PALACE EXPLORER · BEIJING</small></span></a><nav aria-label="探索工具"><button data-panel="map" aria-label="中轴线地图"><i data-icon="map"></i><span>中轴线地图</span></button><button data-panel="passport" aria-label="我的游历"><i data-icon="book"></i><span>我的游历</span><em id="stamp-count">0</em></button><button data-panel="notes" aria-label="观察手记"><i data-icon="pen"></i><span>观察手记</span></button></nav><span class="phase-label">午门 — 太和门 — 太和殿</span></header>

<section id="intro" class="intro"><span class="eyebrow">第一程 · 宫城的秩序</span><h1>从午门，<br>走向太和。</h1><p>脚步丈量宫城，目光读懂建筑。<br>带上一点好奇，走进六百年的时间。</p><button id="enter" class="primary" disabled><span>正在准备故宫场景…</span><i data-icon="arrow"></i></button><div class="intro-meta"><span>自由漫游</span><span>人物交谈</span><span>建筑观察</span><span>游历收藏</span></div><p class="accuracy-mini">本期开放中轴线首段 · 单人探索<br>学习级三维重建，非完整故宫测绘复刻。<button data-panel="about">查看模型依据 ↗</button></p></section>
<section id="quest" class="quest hidden" aria-label="当前探索任务"><div class="quest-head"><span>中轴线研学手册</span><button data-panel="passport" aria-label="打开游历手册"><i data-icon="book"></i></button></div><div class="quest-main"><span id="quest-num">01</span><div><b id="quest-name">走近午门，观察宫门</b><small id="quest-detail">跟随金色观察印记，按 E 与建筑对话</small></div></div><div class="quest-bottom"><span id="distance">前方 46 米</span><div class="progress-track"><span id="progress-fill"></span></div><span id="quest-progress">0 / 5</span></div></section>
